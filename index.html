</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><!----><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/automatically-publish-vscode-plugins-using-github-action/" data-v-25ddbb7a><!--[-->使用 GitHub Action 自动发布 VS Code 插件<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><div class="category-list" data-v-25ddbb7a><span class="icon vpi-folder" data-v-25ddbb7a></span><!--[--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=41282b" data-v-25ddbb7a><!--[-->编程<!--]--><!--[--><!--]--><!----></a><span data-v-25ddbb7a>/</span><!--]--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=aa1cb6" data-v-25ddbb7a><!--[-->GitHub<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 955 字</span><span data-v-25ddbb7a>3 分钟</span></div><div class="tag-list" data-v-25ddbb7a><span class="icon vpi-tag" data-v-25ddbb7a></span><!--[--><a class="vp-link link tag vp-tag-6y60" href="/article/tags/?tag=GitHub" data-v-25ddbb7a><!--[-->GitHub<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2025-01-08</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>为了满足自己的使用需求，这段时间抽空开发了一个 VS Code 插件，开发完成后准备打包发布。看了一下发布方式，觉得使用 vsce 命令行工具发布 VS Code 插件步骤比较繁琐，还是借助 GitHub Action 自动发布更优雅，整体过程和自动发布 npm 包基本相同，感兴趣的可以看看这一篇<a href="https://blog.ifback.com/article/automatically-publish-npm-packages-using-github-action/" target="_blank" rel="noopener noreferrer">文章</a>。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><!----><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/vscode-visualizes-c-call-chain-plugin-c-relation/" data-v-25ddbb7a><!--[-->VS Code 可视化查看 C 调用链插件 C Relation<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><div class="category-list" data-v-25ddbb7a><span class="icon vpi-folder" data-v-25ddbb7a></span><!--[--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=c31f48" data-v-25ddbb7a><!--[-->分享<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 1049 字</span><span data-v-25ddbb7a>4 分钟</span></div><!----><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2024-12-20</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><blockquote>
<p>一直想用 SourceInsight 一样的可以查看函数调用链一样的功能，但是又不想用 SourceInsight，找了一圈没有找到 VS Code 有类似功能的插件，索性自己开发了一个。</p>
</blockquote>
<p>这是一个可以可视化显示 C 函数调用关系的 VS Code 插件，功能纯粹，使用简单。</p>

</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><!----><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/yuque-exporter-a-document-bulk-export-tool/" data-v-25ddbb7a><!--[-->语雀文档批量导出工具 YuqueExporter<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><div class="category-list" data-v-25ddbb7a><span class="icon vpi-folder" data-v-25ddbb7a></span><!--[--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=c31f48" data-v-25ddbb7a><!--[-->分享<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 1725 字</span><span data-v-25ddbb7a>6 分钟</span></div><!----><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2024-11-30</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>一个基于账号密码的个人语雀 Markdown 文档批量导出工具，使用简单便捷。</p>

</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><!----><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/automatically-publish-npm-packages-using-github-action/" data-v-25ddbb7a><!--[-->使用 GitHub Action 自动发布 npm 包<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><div class="category-list" data-v-25ddbb7a><span class="icon vpi-folder" data-v-25ddbb7a></span><!--[--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=41282b" data-v-25ddbb7a><!--[-->编程<!--]--><!--[--><!--]--><!----></a><span data-v-25ddbb7a>/</span><!--]--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=aa1cb6" data-v-25ddbb7a><!--[-->GitHub<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 914 字</span><span data-v-25ddbb7a>3 分钟</span></div><div class="tag-list" data-v-25ddbb7a><span class="icon vpi-tag" data-v-25ddbb7a></span><!--[--><a class="vp-link link tag vp-tag-6y60" href="/article/tags/?tag=GitHub" data-v-25ddbb7a><!--[-->GitHub<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-qd3d" href="/article/tags/?tag=npm" data-v-25ddbb7a><!--[-->npm<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2024-11-10</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>如果自己开发了一个工具包，希望在不同的项目里使用，或者希望分享给别人使用，就可以将其封装上传到 npm，这样别人就可以很简单地一行命令安装和使用。</p>
<p>一般情况下，需要在本地项目目录下登录 npm，然后使用 publish 命令推送。如果包有更新，就需要重复执行，不够方便。加上开发基本都会用 GitHub 进行版本管理，因此就可以借助于 GitHub Action 自动发布 npm 包。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><!----><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/search-engine-webmaster-platform-concise-use-guide/" data-v-25ddbb7a><!--[-->搜索引擎站长平台简明使用指南<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><div class="category-list" data-v-25ddbb7a><span class="icon vpi-folder" data-v-25ddbb7a></span><!--[--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=41282b" data-v-25ddbb7a><!--[-->编程<!--]--><!--[--><!--]--><!----></a><span data-v-25ddbb7a>/</span><!--]--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=22649b" data-v-25ddbb7a><!--[-->建站<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 1368 字</span><span data-v-25ddbb7a>5 分钟</span></div><div class="tag-list" data-v-25ddbb7a><span class="icon vpi-tag" data-v-25ddbb7a></span><!--[--><a class="vp-link link tag vp-tag-igv6" href="/article/tags/?tag=SEO" data-v-25ddbb7a><!--[-->SEO<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2024-10-25</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>在搭建并部署了个人网站后，如果希望自己的网站被搜索引擎收录，网站内容能够被别人检索到，那就有必要在搜索引擎的站长平台提交自己的网站，根据站长平台的统计数据优化网站的 SEO。</p>
<p>各个搜索引擎的站长平台功能和使用方式大同小异，下面简单介绍一下<code v-pre>必应</code>和<code v-pre>百度</code>两个搜索引擎的站长平台。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><!----><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/deploy-personal-website-through-ddns-and-ipv6/" data-v-25ddbb7a><!--[-->通过 DDNS 和 IPV6 部署可公网访问的个人网站<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><div class="category-list" data-v-25ddbb7a><span class="icon vpi-folder" data-v-25ddbb7a></span><!--[--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=41282b" data-v-25ddbb7a><!--[-->编程<!--]--><!--[--><!--]--><!----></a><span data-v-25ddbb7a>/</span><!--]--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=22649b" data-v-25ddbb7a><!--[-->建站<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 1672 字</span><span data-v-25ddbb7a>6 分钟</span></div><div class="tag-list" data-v-25ddbb7a><span class="icon vpi-tag" data-v-25ddbb7a></span><!--[--><a class="vp-link link tag vp-tag-i9v4" href="/article/tags/?tag=IPV6" data-v-25ddbb7a><!--[-->IPV6<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-i9v4" href="/article/tags/?tag=DDNS" data-v-25ddbb7a><!--[-->DDNS<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2024-10-19</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>如果想让局域网的个人网站能够在公网访问，就必须要公网地址，目前公网 IPV4 地址个人难以申请，但 IPV6 地址使用门槛就非常低，几乎都是支持的。</p>
<p>本篇文章就接着<a href="https://blog.ifback.com/article/android-phone-deploy-personal-website-by-termux/" target="_blank" rel="noopener noreferrer">这篇</a>介绍的 Termux 部署个人网站，让这个网站可以在公网访问。如果你没有看过，可以先看一下。如果你有部署个人网站，或者其他需要通过公网访问的需求，也可以参考一下。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><!----><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/android-phone-deploy-personal-website-by-termux/" data-v-25ddbb7a><!--[-->安卓手机使用 Termux 部署个人网站<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><div class="category-list" data-v-25ddbb7a><span class="icon vpi-folder" data-v-25ddbb7a></span><!--[--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=41282b" data-v-25ddbb7a><!--[-->编程<!--]--><!--[--><!--]--><!----></a><span data-v-25ddbb7a>/</span><!--]--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=22649b" data-v-25ddbb7a><!--[-->建站<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 1399 字</span><span data-v-25ddbb7a>5 分钟</span></div><div class="tag-list" data-v-25ddbb7a><span class="icon vpi-tag" data-v-25ddbb7a></span><!--[--><a class="vp-link link tag vp-tag-i9v4" href="/article/tags/?tag=Termux" data-v-25ddbb7a><!--[-->Termux<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2024-10-17</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>之前折腾个人网站的时候用云服务器，想到云服务器本质就是一个跑程序的 Linux 系统，想到用闲置的安卓手机是不是也可以，于是用淘汰下来的安卓手机试着部署了个人网站。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><!----><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/the-sweet-osmanthus-flavor-of-nanjing/" data-v-25ddbb7a><!--[-->桂花味的南京城<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><div class="category-list" data-v-25ddbb7a><span class="icon vpi-folder" data-v-25ddbb7a></span><!--[--><!--[--><a class="vp-link link no-icon" href="/article/categories/?id=8936f5" data-v-25ddbb7a><!--[-->随笔<!--]--><!--[--><!--]--><!----></a><!----><!--]--><!--]--></div><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 1343 字</span><span data-v-25ddbb7a>4 分钟</span></div><!----><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2024-10-03</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>南京，离杭州不远，票也不需要抢，趁着假期去玩了两天。</p>
